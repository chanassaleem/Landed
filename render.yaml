# A development URL, not the demo. Render's free web services sleep after
# 15 minutes idle and take 30-60 seconds to wake, which is a bad minute
# to spend standing in a customer's office. Use Cloud Run for anything
# you are going to show someone.
services:
  - type: web
    name: landed
    runtime: docker
    plan: free
    # Closest Render offers to the Supabase project in Sydney. Check the
    # current region list in the dashboard; Render's has changed before.
    region: singapore
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      # sync: false means Render prompts for the value and keeps it out
      # of this file. The service role key bypasses every policy in
      # supabase/migrations -- it belongs in the dashboard, never here.
      #
      # DATABASE_URL must be the SESSION POOLER string from Supabase
      # (Connect -> Session pooler, port 5432). The direct connection
      # string resolves to IPv6 only unless the project pays for the IPv4
      # add-on, and Render is IPv4-only, so the direct string fails with
      # a name-resolution error that looks nothing like its cause.
      # /health/supabase warns if it spots the wrong one.
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      # Said rather than relied on. Secure cookies are the default now
      # -- the flag is dropped only where LANDED_ENV names a
      # development environment -- but a deployment that states what
      # it is does not depend on somebody remembering the rule.
      - key: LANDED_ENV
        value: production
      # The free instance has 512 MB and 0.1 CPU; one worker is all that fits.
      - key: WEB_CONCURRENCY
        value: "1"
